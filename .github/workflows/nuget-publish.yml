name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for NuGet Trusted Publishing (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    environment: nuget  # Must match the environment configured on nuget.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore csharp/Ardu2IGC/Ardu2IGC.csproj

      - name: Build
        run: dotnet build csharp/Ardu2IGC/Ardu2IGC.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack csharp/Ardu2IGC/Ardu2IGC.csproj -c Release --no-build --output ./nupkg

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg/*.nupkg

      - name: Push to NuGet (Trusted Publishing)
        uses: nuget/publish-on-nuget-action@v2
        with:
          nupkg-path: './nupkg/*.nupkg'
