name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.0)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore csharp/Ardu2IGC/Ardu2IGC.csproj

      - name: Build
        run: dotnet build csharp/Ardu2IGC/Ardu2IGC.csproj -c Release --no-restore

      - name: Test
        run: dotnet test csharp/Ardu2IGC/Ardu2IGC.csproj -c Release --no-build --verbosity normal || true

      - name: Pack
        run: dotnet pack csharp/Ardu2IGC/Ardu2IGC.csproj -c Release --no-build --output ./nupkg

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg/*.nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
