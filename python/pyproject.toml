[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ardu2igc"
version = "1.0.0"
description = "Convert ArduPilot .bin log files to IGC flight recorder format"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.9"
authors = [
    {name = "Sameer Somnath Sangle", email = "shauntasin@users.noreply.github.com"},
]
keywords = ["ardupilot", "igc", "flight-log", "drone", "uav", "gliding", "arducopter", "arduplane", "dataflash"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/shauntasin/ardu2igc"
Repository = "https://github.com/shauntasin/ardu2igc"
Issues = "https://github.com/shauntasin/ardu2igc/issues"

[project.optional-dependencies]
pymavlink = ["pymavlink>=2.4.0"]
dev = ["pytest>=7.0", "pymavlink>=2.4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ardu2igc*"]
